name: Build OlirumPlay Native APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Files
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/OlirumPlay-v1.3.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/OlirumPlay.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk OlirumPlay-v1.3.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk OlirumPlay.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OlirumPlay-APK-v1.3.0
          path: release-apk/*
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.3.0
          name: "OlirumPlay v1.3.0 (Rádios Online ao Vivo Multigêneros & Identidade Oficial)"
          body: |
            ### 📻 OlirumPlay v1.3.0 — Rádios Online Multigêneros, Splash Screen & Assinatura Permanente

            **Novas Funcionalidades e Correções:**
            - 📻 **Rádios Online ao Vivo com Múltiplos Gêneros Gratuitos:**
              - **✝️ Música Católica:** Rádio Evangelizar (Pe. Reginaldo Manzotti), Rádio Aparecida 104.3 FM, Rádio Canção Nova FM, Rádio Evangelizar Família, Rádio Católica Web.
              - **🎸 Rock Clássico:** 89 FM A Rádio Rock, Virgin Radio Classic Rock, Virgin Rock Anos 70, Virgin Rock Anos 80, 1.FM Classic Rock Replay.
              - **🎻 Música Clássica:** Classic FM (Reino Unido), Radio Swiss Classic (Suíça), YourClassical Relax, WALM Classical 2 HD.
              - **🤠 Sertanejo & Modão:** Sertaneja 106.7 FM (modão, raiz e universitário).
              - **🌴 MPB & Bossa Nova:** Bossa Jazz Brasil (Tom Jobim, Elis, Chico), Antena 1 Brasil.
              - **📻 Flashback Anos 70, 80 e 90:** Rádio Saudade 99.7 FM, Beatles 4 Ever Rádio.
              - **🎷 Jazz & Blues:** 101 Smooth Jazz (instrumental refinado).
              - **⚡ Eletrônica & Dance:** Dance Wave! (House, EDM e pistas).
              - **🪗 Forró Tradicional:** Rádio Forró Brasil (pé de serra, xote e baião).
              - **🇯🇲 Reggae:** La Grosse Radio Reggae (Roots Reggae & Dub).
              - **🕊️ Gospel & Adoração:** Melodia FM 97.5 (louvores e adoração).
              - 🌐 **Busca Livre Mundial:** Pesquisa conectada ao diretório Radio Browser com +30.000 estações do mundo todo.
            - 🔴 **Modo Ao Vivo no Player:** Identificação automática de streaming ao vivo com badge `AO VIVO` pulsante.
            - 🏠 **Destaques na Tela Inicial:** Acesso imediato às principais rádios com 1 toque.
            - 🎨 **Logo Oficial & Tela de Abertura (Splash Screen):** Animação com degradê neon equalizador e lema "MÚSICA EM ALTA FIDELIDADE".
            - 🔑 **Assinatura Permanente (Keystore):** Todas as versões agora utilizam `olirumplay.keystore`, garantindo atualização sem perda nem erro de assinatura.
            - 🔤 **Zero Quebra de Linha:** Interface refinada e sem quebras indesejadas em nenhuma resolução.
          files: |
            release-apk/OlirumPlay-v1.3.0.apk
            release-apk/OlirumPlay.apk
