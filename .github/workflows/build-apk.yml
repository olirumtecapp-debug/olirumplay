name: Build OlirumPlay Native APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Files
        run: |
          mkdir -p release-apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-apk/OlirumPlay-v1.16.0.apk
            cp android/app/build/outputs/apk/release/app-release.apk release-apk/OlirumPlay.apk
            cp android/app/build/outputs/apk/release/app-release.apk OlirumPlay-v1.16.0.apk
            cp android/app/build/outputs/apk/release/app-release.apk OlirumPlay.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/OlirumPlay-v1.16.0.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/OlirumPlay.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk OlirumPlay-v1.16.0.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk OlirumPlay.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OlirumPlay-APK-v1.16.0
          path: release-apk/*
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.16.0
          name: "OlirumPlay v1.16.0 - Blindagem Total de Persistência em Segundo Plano & Auto-Reconexão"
          body: |
            ### OlirumPlay v1.16.0 - Blindagem Total de Persistência em Segundo Plano & Auto-Reconexão

            **Novidades e Melhorias:**
            - **Partida Explícita do Foreground Service:**
              - Serviço iniciado de forma autônoma (`startForegroundService`), tornando a execução independente do fechamento ou suspensão da interface.
            - **WakeLock & WifiLock de Alta Performance:**
              - CPU mantida acordada durante a reprodução ativa e Wi-Fi protegido contra suspensão Doze em segundo plano.
            - **Auto-Reconexão Resiliente para Rádios:**
              - Emissoras de rádio online reconectam suavemente após quedas temporárias de rede (4G/Wi-Fi) sem parar o player.
            - **Auto-Skip sem Travamento para Arquivos Locais:**
              - Falhas em faixas isoladas avançam diretamente para a próxima música sem cortar a playlist.
            - **Repetição Contínua Ativa:**
              - Playlists locais continuam rodando sem interrupção repentina.
          files: |
            release-apk/OlirumPlay-v1.16.0.apk
            release-apk/OlirumPlay.apk
          token: ${{ secrets.GITHUB_TOKEN }}
