name: Build OlirumPlay Native APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Files
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/OlirumPlay-v1.0.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/OlirumPlay.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk OlirumPlay.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OlirumPlay-APK
          path: release-apk/*
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: "OlirumPlay v1.0.0 (Native Android Jetpack Compose)"
          body: |
            ### 🎵 OlirumPlay v1.0.0 — Aplicativo de Música Premium Nativo

            **Arquitetura 100% Android Nativo:**
            - **Linguagem & UI:** Kotlin + Jetpack Compose + Material 3 (Design Claro Premium).
            - **Reprodução Indestrutível:** AndroidX Media3 ExoPlayer + `MediaSessionService` para reprodução contínua em segundo plano, tela bloqueada e barra de notificações.
            - **Escaneamento do Smartphone:** Leitor automático de músicas locais via `MediaStore.Audio.Media.EXTERNAL_CONTENT_URI` (MP3, FLAC, WAV, AAC, M4A).
            - **Catálogo Online Gratuito:** Integração oficial com a API Audius (streaming de tendências mundiais e busca por gêneros).
            - **Letras Sincronizadas (Karaokê):** Integração com LRCLIB API com rolagem e destaque da linha ativa em tempo real.
            - **Persistência de Dados:** Banco de dados Room (`AppDatabase`) para favoritos e DataStore Preferences para última posição e estado de reprodução.
            - **Widgets:** Suporte nativo a Widgets de Tela Inicial Android (4x1 & 4x2) e equalizador de 5 frequências.
          files: |
            release-apk/OlirumPlay-v1.0.0.apk
            release-apk/OlirumPlay.apk
