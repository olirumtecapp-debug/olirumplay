name: Build OlirumPlay Native APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Files
        run: |
          mkdir -p release-apk
          # Usar o APK de Release oficial assinado permanentemente com v1 e v2
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-apk/OlirumPlay-v1.6.0.apk
            cp android/app/build/outputs/apk/release/app-release.apk release-apk/OlirumPlay.apk
            cp android/app/build/outputs/apk/release/app-release.apk OlirumPlay-v1.6.0.apk
            cp android/app/build/outputs/apk/release/app-release.apk OlirumPlay.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/OlirumPlay-v1.6.0.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/OlirumPlay.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk OlirumPlay-v1.6.0.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk OlirumPlay.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OlirumPlay-APK-v1.6.0
          path: release-apk/*
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.6.0
          name: "OlirumPlay v1.6.0 — Identidade Visual Completa & Filtro Anti-Colisão de Gêneros"
          body: |
            ### 🎧 OlirumPlay v1.6.0 — Identidade Visual Oficial & Melhorias de Gêneros

            **Principais Novidades e Correções:**
            - 🎨 **Identidade Visual 3D Completa (27 Obras Vetoriais Neon):**
              - Todas as 18 categorias de rádio agora possuem capas 3D exclusivas e vibrantes geradas via IA.
              - Atalhos rápidos na Home com ilustrações exclusivas (Músicas do Celular, Rádios Online, Explorar Estilos).
              - Banners "Áudio Indestrutível" e cabeçalhos de pastas com acabamento artístico premium.
            - 🎯 **Filtro Anti-Colisão Rigoroso de Gêneros:**
              - Eliminação total de contaminação cruzada (ex: Classic Rock aparecendo em Música Clássica).
              - Remoção de tags ambíguas e aplicação de listas de exclusão estritas em todas as 18 categorias.
            - ☀️/🌙 **Modo Claro / Escuro 100% Funcional:**
              - Alternância dinâmica suave no topo da tela com suporte completo a paleta de alto contraste tanto no tema claro quanto no escuro.
            - 🔀 **Modo Aleatório para Músicas e Pastas:**
              - Botão "Aleatório" dedicado na visualização de detalhes de pasta.
              - Botões de reprodução rápida e aleatória diretamente em cada card de pasta da biblioteca.
            - 🔑 **Assinatura Universal Permanente v1 + v2:** Atualização contínua sem erro de incompatibilidade.
          files: |
            release-apk/OlirumPlay-v1.6.0.apk
            release-apk/OlirumPlay.apk
          token: ${{ secrets.GITHUB_TOKEN }}
