name: Build OlirumPlay Native APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Files
        run: |
          mkdir -p release-apk
          # Usar o APK de Release oficial assinado permanentemente com v1 e v2
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-apk/OlirumPlay-v1.14.1.apk
            cp android/app/build/outputs/apk/release/app-release.apk release-apk/OlirumPlay.apk
            cp android/app/build/outputs/apk/release/app-release.apk OlirumPlay-v1.14.1.apk
            cp android/app/build/outputs/apk/release/app-release.apk OlirumPlay.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/OlirumPlay-v1.14.1.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/OlirumPlay.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk OlirumPlay-v1.14.1.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk OlirumPlay.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OlirumPlay-APK-v1.14.1
          path: release-apk/*
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
