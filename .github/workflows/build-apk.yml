name: Build OlirumPlay Native APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Files
        run: |
          mkdir -p release-apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-apk/OlirumPlay-v1.15.0.apk
            cp android/app/build/outputs/apk/release/app-release.apk release-apk/OlirumPlay.apk
            cp android/app/build/outputs/apk/release/app-release.apk OlirumPlay-v1.15.0.apk
            cp android/app/build/outputs/apk/release/app-release.apk OlirumPlay.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/OlirumPlay-v1.15.0.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/OlirumPlay.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk OlirumPlay-v1.15.0.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk OlirumPlay.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OlirumPlay-APK-v1.15.0
          path: release-apk/*
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.15.0
          name: "OlirumPlay v1.15.0 - Rádios do Brasil (Nacionais FM/AM) e Filtro Inteligente Anti-Duplicação"
          body: |
            ### OlirumPlay v1.15.0 - Rádios do Brasil (Nacionais FM/AM) e Filtro Inteligente Anti-Duplicação

            **Novidades e Melhorias:**
            - **Nova Categoria: Rádios do Brasil (Nacionais FM/AM):**
              - Emissoras consagradas de São Paulo, Rio e de todo o país (Antena 1, Alpha FM, JB FM, Rádio Bandeirantes, BandNews FM, Super Rádio Tupi, Mix FM, Saudade FM).
              - Busca dinâmica com ordenação pelas mais ouvidas do Brasil via Radio Browser API.
            - **Algoritmo Anti-Duplicação e Filtro Inteligente:**
              - Eliminação de estações de nichos fortes vazando para múltiplos gêneros genéricos.
              - Afinidade primária e exclusão cruzada de tags enganosas.
            - **Capa Oficial Exclusiva:**
              - Nova capa `genre_nacionais` com identidade visual luminosa e vetorial em alta definição.
          files: |
            release-apk/OlirumPlay-v1.15.0.apk
            release-apk/OlirumPlay.apk
          token: ${{ secrets.GITHUB_TOKEN }}
