name: Build OlirumPlay Native APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Files
        run: |
          mkdir -p release-apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-apk/OlirumPlay-v1.14.1.apk
            cp android/app/build/outputs/apk/release/app-release.apk release-apk/OlirumPlay.apk
            cp android/app/build/outputs/apk/release/app-release.apk OlirumPlay-v1.14.1.apk
            cp android/app/build/outputs/apk/release/app-release.apk OlirumPlay.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/OlirumPlay-v1.14.1.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/OlirumPlay.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk OlirumPlay-v1.14.1.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk OlirumPlay.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OlirumPlay-APK-v1.14.1
          path: release-apk/*
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.14.1
          name: "OlirumPlay v1.14.1 - Harmonia Visual, Presets Anti-Quebra e Filtro Estrito de Radios"
          body: |
            ### OlirumPlay v1.14.1 - Harmonia Visual, Presets Anti-Quebra e Filtro Estrito de Radios

            **Novidades e Ajustes Solicitados:**
            - **Equalizador e Presets Harmonizados:**
              - Layout de 3 colunas simetricas para os modos: "Mega Bass", "Voz Clara" e "Modo Estrada".
              - Tipografia ajustada para nao quebrar linha em nenhuma tela no badge ativo e nos botoes.
            - **Filtro Anti-Contaminacao em Radios Online:**
              - Eliminacao completa de mistura de generos (Catolica, Classica, Jazz, Sertanejo, Rock).
              - Validacao estrita por tags primarias e palavras-chave negativas.
            - **Landing Page Acolhedora:**
              - Paleta de cores suave para os olhos, eliminando o excesso de brilho branco.
              - Download direto do APK v1.14.1 em https://olirumplay.vercel.app.
          files: |
            release-apk/OlirumPlay-v1.14.1.apk
            release-apk/OlirumPlay.apk
          token: ${{ secrets.GITHUB_TOKEN }}
