name: Build OlirumPlay Native APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Files
        run: |
          mkdir -p release-apk
          # Usar o APK de Release oficial assinado permanentemente com v1 e v2
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-apk/OlirumPlay-v1.4.0.apk
            cp android/app/build/outputs/apk/release/app-release.apk release-apk/OlirumPlay.apk
            cp android/app/build/outputs/apk/release/app-release.apk OlirumPlay-v1.4.0.apk
            cp android/app/build/outputs/apk/release/app-release.apk OlirumPlay.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/OlirumPlay-v1.4.0.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/OlirumPlay.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk OlirumPlay-v1.4.0.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk OlirumPlay.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OlirumPlay-APK-v1.4.0
          path: release-apk/*
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.4.0
          name: "OlirumPlay v1.4.0 (Nova Identidade Visual Oficial & Assinatura v1/v2 Universal)"
          body: |
            ### 🎨 OlirumPlay v1.4.0 — Nova Identidade Visual 3D & Assinatura Universal (v1 + v2)

            **Melhorias Desta Versão:**
            - 🎨 **Novos Ícones e Logotipo Oficial 3D:**
              - Logotipo 3D horizontal estilizado (`Logo Neon 3D OlirumPlay.png`) na tela de abertura (Splash Screen).
              - Novo ícone de aplicativo (`Ícone Neon de Áudio com Play.png`) aplicado em todas as resoluções de launcher.
              - Ícone oficial de áudio integrado na barra superior e cabeçalhos.
            - 🔑 **Assinatura Universal Permanente (JAR v1 + APK Block v2):**
              - Configurado `v1SigningEnabled true` e `v2SigningEnabled true` com `olirumplay.keystore`.
              - Compilação direta em modo Release otimizado, permitindo instalações e atualizações diretas no Android sem erro de incompatibilidade de pacote.
            - 📻 **Rádios Online ao Vivo com 11+ Gêneros Gratuitos:**
              - Católica, Rock Clássico, Música Clássica, Sertanejo & Modão, MPB & Bossa Nova, Flashback Anos 70/80/90, Jazz & Blues, Eletrônica, Forró, Reggae e Gospel.
            - 🔤 **Zero Quebra de Linha:** Interface polida e responsiva em qualquer tela.
          files: |
            release-apk/OlirumPlay-v1.4.0.apk
            release-apk/OlirumPlay.apk
          token: ${{ secrets.GITHUB_TOKEN }}
