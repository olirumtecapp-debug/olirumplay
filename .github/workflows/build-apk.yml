name: Build OlirumPlay Native APK

on:
  push:
    branches: [main, master, release/olirumplay-1.17.0]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Files
        run: |
          mkdir -p release-apk
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          cp "$apk" release-apk/OlirumPlay-v1.17.0.apk
          cp "$apk" release-apk/OlirumPlay.apk

      - name: Verify APK and upgrade signature
        run: |
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$signer"
          curl -fsSL --retry 3 'https://github.com/olirumtecapp-debug/olirumplay/releases/download/v1.16.0/OlirumPlay-v1.16.0.apk' -o /tmp/olirum-previous.apk
          "$signer" verify --print-certs /tmp/olirum-previous.apk | grep 'certificate SHA-256 digest' > /tmp/olirum-previous-cert
          "$signer" verify --print-certs release-apk/OlirumPlay-v1.17.0.apk | grep 'certificate SHA-256 digest' > /tmp/olirum-new-cert
          diff -u /tmp/olirum-previous-cert /tmp/olirum-new-cert

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OlirumPlay-APK-v1.17.0
          path: release-apk/*
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.17.0
          name: "OlirumPlay v1.17.0"
          body: |
            - Continuar ouvindo no início, com retomada da faixa local, fila e posição.
            - Widgets 1×1 e 4×1 com controles sincronizados.
            - Rádios organizadas por categoria principal e deduplicação de streams.
          files: |
            release-apk/OlirumPlay-v1.17.0.apk
            release-apk/OlirumPlay.apk
          token: ${{ secrets.GITHUB_TOKEN }}
