name: Build OlirumPlay Native APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Files
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/OlirumPlay-v1.2.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/OlirumPlay.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk OlirumPlay-v1.2.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk OlirumPlay.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OlirumPlay-APK-v1.2.0
          path: release-apk/*
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.2.0
          name: "OlirumPlay v1.2.0 (Logo Oficial, Tela de Abertura & Assinatura Permanente)"
          body: |
            ### 🎵 OlirumPlay v1.2.0 — Versão com Assinatura Permanente & Identidade Visual

            **Novas Melhorias e Correções:**
            - **Assinatura Criptográfica Permanente (`olirumplay.keystore`):** Todas as compilações agora utilizam uma chave de assinatura exclusiva e fixa. Nunca mais ocorrerá erro de "Conflito com o app anterior" nas próximas atualizações!
            - **Tela de Abertura Oficial (Splash Screen):** Exibição do logotipo oficial neon do OlirumPlay com animação suave de entrada e lema "MÚSICA EM ALTA FIDELIDADE".
            - **Ícone do Aplicativo Oficial:** Substituição dos ícones padrão do Android pelo logotipo neon oficial do OlirumPlay em todas as resoluções (mipmap-mdpi até xxxhdpi).
            - **Logo Oficial no Topo:** A barra superior de todas as telas agora exibe o logotipo da marca em vez de ícones genéricos.
            - **Navegação por Pastas e Playlists:** Mantida a navegação seletiva por pastas locais e criação de playlists.
            - **Modo Claro e Escuro:** Alternância de tema com 1 toque.
          files: |
            release-apk/OlirumPlay-v1.2.0.apk
            release-apk/OlirumPlay.apk
