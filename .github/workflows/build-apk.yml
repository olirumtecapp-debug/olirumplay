name: Build OlirumPlay Native APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Files
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/OlirumPlay-v1.1.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/OlirumPlay.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk OlirumPlay-v1.1.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk OlirumPlay.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OlirumPlay-APK-v1.1.0
          path: release-apk/*
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.1.0
          name: "OlirumPlay v1.1.0 (Pastas, Playlists, Modo Escuro & Zero Quebra de Linha)"
          body: |
            ### 🎵 OlirumPlay v1.1.0 — Nova Versão Aprimorada

            **Novas Funcionalidades e Correções:**
            - **Navegação por Pastas (Pastinhas do Celular):** Nova aba que agrupa músicas por diretório físico (Download, WhatsApp, Álbuns, etc.). Toque em uma pasta e reproduza **apenas a sequência daquela pasta**!
            - **Criação e Gestão de Playlists:** Crie novas playlists com nome personalizado e adicione qualquer música (local ou online) com 1 toque no botão '+'.
            - **Modo Escuro (Dark Mode):** Alternância instantânea entre Modo Claro Premium e Modo Escuro Cyber com botão no topo e no menu, persistindo sua preferência.
            - **Zero Quebra de Linha:** Redesenho completo do menu inferior com 5 abas compactas (Início, Músicas, Explorar, Letras, Biblioteca), campos de busca de linha única e rótulos sem quebras de texto indesejadas.
            - **Botão Início Corrigido:** Navegação 100% responsiva para voltar à tela inicial a qualquer momento sem travamentos.
            - **Catálogo Online:** Busca por gêneros musicais e artistas originais.
          files: |
            release-apk/OlirumPlay-v1.1.0.apk
            release-apk/OlirumPlay.apk
